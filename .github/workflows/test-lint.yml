---
name: test-lint
on:
  push:
  pull_request:
    branches:
    - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    # Setup Go
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
      
    # Run vet & lint on the code
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v7
      with:
        version: v2.15.0
    
    # Run testing on the code
    - name: Run testing
      run: make test

...